[VideoInput]
# Standard full-screen capture for X11
type=screen
area_x=0
area_y=0
area_width=1920
area_height=1080
frame_rate=30
record_cursor=true
follow_fullscreen=true

[AudioInput]
# This links directly to the virtual PipeWire source we created
record_audio=true
backend=pulseaudio
source=rnnoise_source
# Using 48k for higher fidelity digital audio
sample_rate=48000

[Output]
# MKV is better for modern workflows (no corruption if crash)
file_directory=/home/ziad/Videos
file_name=recording-%Y-%m-%d_%H.%M.%S.mkv
container=matroska

[VideoCodec]
# H.264 is the modern standard
codec=libx264
# CRF 23 is the "Sweet Spot" for quality vs size
# Ultrafast ensures your Sandy Bridge CPU doesn't lag
options=preset=ultrafast,crf=23
bitrate=2000

[AudioCodec]
# MP3/AAC are standard, but Vorbis is great for Linux-native files
codec=libvorbis
bitrate=128

[GUI]
# Keeps the interface clean and out of the way
window_x=100
window_y=100
window_width=800
window_height=600
record_preview=false
minimize_to_tray=true
